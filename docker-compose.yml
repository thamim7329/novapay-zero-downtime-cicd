

services:
  novapay-green:
    build: .
    container_name: novapay-green
    environment:
      - PORT=3000
      - APP_VERSION=v1.0-green
    ports:
      - "4001:3000"
    restart: always

  nginx-lb:
  build: ./nginx
  container_name: novapay-nginx-lb
  ports:
    - "8080:80"
  depends_on:
    - novapay-green
  restart: always