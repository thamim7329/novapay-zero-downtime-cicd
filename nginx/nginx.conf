events { worker_connections 1024; }

http {
    upstream novapay_backend {
        # Default points to Blue (v1.0)
        server novapay-green:3000;
        # For Canary or Green switch, you can manage weights here
    }

    server {
        listen 80;

        location / {
            proxy_pass http://novapay_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Zero-Downtime timeout configurations
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
        }

        # Health check endpoint for load balancer verification
        location /health {
            proxy_pass http://novapay_backend/health;
        }
    }
}